name: Publish AI Frontier
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - 'scripts/build_site.py'
      - 'scripts/page_navigation.py'
      - 'scripts/chatgpt_charts.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Merges made by the auto-merge workflow use the workflow token, and
  # token-made pushes do not trigger the push trigger above — a merged
  # briefing changed no deployed page until a human pushed (2026-11-19).
  # Republish when that workflow completes on main instead. The run is
  # idempotent: when nothing merged, the same content is redeployed.
  workflow_run:
    workflows: ["Auto-merge validated daily briefings"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    # The conclusion guard applies only to the workflow_run trigger;
    # push and manual dispatch runs publish as before.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install 'Markdown>=3.6,<4' 'PyYAML>=6,<7' 'bleach>=6,<7'
      - name: Test ChatGPT chart conversion
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build searchable index
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    # Concurrency sits on the deploy job, not the workflow: a
    # workflow-level group is joined before job conditions are evaluated,
    # so a workflow_run that skips its build still cancelled an in-flight
    # push deploy (2026-11-22, #64 never published). Here the group is
    # requested only by a deploy that will run, and an in-progress deploy
    # is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Auto-merge validated daily briefings

# Runs only after a required validation workflow completes. No PR code is checked
# out or executed with this workflow's write-capable token.
on:
  workflow_run:
    workflows:
      - OpenShelf validation
      - Briefing knowledge mining gate
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-briefings
  cancel-in-progress: false

jobs:
  queue-validated-briefing:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted PR, both gates, and unresolved findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the PR by the workflow's commit, not by untrusted PR text.
          prs=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls")
          count=$(jq '[.[] | select(.state == "open" and .base.ref == "main" and (.head.ref | test("^briefing/[0-9]{4}-[0-9]{2}-[0-9]{2}[-/]")))] | length' <<<"$prs")
          if [[ "$count" != 1 ]]; then
            echo "No unique eligible open briefing PR; not merging."
            exit 0
          fi
          pr=$(jq -r '[.[] | select(.state == "open" and .base.ref == "main" and (.head.ref | test("^briefing/[0-9]{4}-[0-9]{2}-[0-9]{2}[-/]")))][0].number' <<<"$prs")
          details=$(gh api "repos/$REPO/pulls/$pr")
          [[ $(jq -r '.head.sha' <<<"$details") == "$RUN_SHA" ]] || { echo "PR advanced since validation"; exit 0; }
          [[ $(jq -r '.head.repo.full_name' <<<"$details") == "$REPO" ]] || { echo "Fork PR requires manual review"; exit 0; }
          [[ $(jq -r '.draft' <<<"$details") == false ]] || { echo "Draft PR"; exit 0; }
          [[ $(jq -r '.mergeable' <<<"$details") == true ]] || { echo "Conflicted or mergeability unknown"; exit 0; }

          # This workflow is for content-only briefings. Any code, policy, workflow
          # or automation change is excluded and must be reviewed separately.
          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100")
          if jq -e '[.[].filename | select((startswith("wiki/") or . == "index.md") | not)] | length > 0' <<<"$files" >/dev/null; then
            echo "Non-content file changed; manual review required."
            exit 0
          fi
          if ! jq -e '[.[].filename | select(test("^wiki/briefings/[0-9]{4}/[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\\.md$"))] | length > 0' <<<"$files" >/dev/null; then
            echo "No dated briefing file in PR."
            exit 0
          fi

          # Both independent required gates must have succeeded on this exact SHA.
          checks=$(gh api "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100")
          for name in lint mining-audit; do
            if ! jq -e --arg name "$name" '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0' <<<"$checks" >/dev/null; then
              echo "Gate $name missing, pending or failing; not merging."
              exit 0
            fi
          done

          owner=${REPO%%/*}
          name=${REPO#*/}
          threads=$(gh api graphql -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100) { pageInfo { hasNextPage } nodes { isResolved } } } } }' -f owner="$owner" -f name="$name" -F number="$pr")
          if jq -e '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage or ([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length > 0)' <<<"$threads" >/dev/null; then
            echo "Unresolved or uninspected review threads; not merging."
            exit 0
          fi

          # GitHub enforces any additional branch-protection requirements.
          # Do not use --admin or bypass. If the repository has no auto-merge
          # prerequisites, gh may merge immediately; the two gates above remain
          # mandatory regardless.
          gh pr merge "$pr" --repo "$REPO" --squash --auto --delete-branch
          echo "Requested auto-merge for PR #$pr after verified gates."

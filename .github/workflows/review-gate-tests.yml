name: Review gate tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_review_gate.py -v

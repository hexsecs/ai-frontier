name: Review gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review event relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (rerun after thread resolution)
        required: true
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            [[ "$REQUESTED" =~ ^[1-9][0-9]*$ ]]
            PRS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED" | jq -ce '[{pr:.number,sha:.head.sha}]')
          else
            # Membership changes and relay events reconcile all surviving heads.
            # Relay is only a wake-up signal. Never trust its PR association,
            # artifacts, head SHA or branch. Enumerate open PRs from our API.
            PRS=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" | jq -ce '[.[][] | {pr:.number,sha:.head.sha}] | group_by(.sha) | map(.[0])')
          fi
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"
  review-gate:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.prs) }}
    concurrency:
      group: review-policy-${{ github.repository }}-${{ matrix.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Evaluate current review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
          EVENT_HEAD: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          source scripts/review_check_run.sh
          if [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            set_check "$EVENT_HEAD" in_progress
          fi
          HEAD="$EVENT_HEAD"
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          trap 'set_check "$HEAD" completed failure' EXIT
          set_check "$HEAD" in_progress
          evaluate() {
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid,baseRefName,mergeStateStatus,state > /tmp/pr.json
          jq -e --arg head "$HEAD" '.headRefOid == $head and .baseRefName == "main" and .state == "OPEN"' /tmp/pr.json >/dev/null
          gh api graphql --paginate --slurp -f query='query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviews(first:100,after:$endCursor){nodes{author{login __typename} state body commit{oid}} pageInfo{hasNextPage endCursor}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" > /tmp/reviews.json
          gh api graphql --paginate --slurp -f query='query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100,after:$endCursor){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" > /tmp/threads.json
          gh api graphql --paginate --slurp -f query='query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){comments(first:100,after:$endCursor){nodes{author{login __typename} body} pageInfo{hasNextPage endCursor}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" > /tmp/comments.json
          MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          jq -n --slurpfile pr /tmp/pr.json --slurpfile r /tmp/reviews.json --slurpfile t /tmp/threads.json --slurpfile c /tmp/comments.json --arg main "$MAIN" '{pr:$pr[0],reviews:[$r[0][].data.repository.pullRequest.reviews.nodes[]],threads:[$t[0][].data.repository.pullRequest.reviewThreads.nodes[]],comments:[$c[0][].data.repository.pullRequest.comments.nodes[]],main_sha:$main}' > /tmp/gate.json
          test -f scripts/check_review_gate.py || { echo 'Trusted gate not installed'; exit 1; }
          python scripts/check_review_gate.py /tmp/gate.json
          }
          evaluate_shared() {
            # Commit-scoped checks must never authorize an unreviewed sibling PR.
            local siblings
            siblings=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" | jq -ce --arg head "$HEAD" '[.[][] | select(.head.sha==$head) | .number] | unique')
            jq -e 'length > 0' <<<"$siblings" >/dev/null
            for PR in $(jq -r '.[]' <<<"$siblings"); do
              evaluate
            done
            test "$siblings" = "$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" | jq -ce --arg head "$HEAD" '[.[][] | select(.head.sha==$head) | .number] | unique')"
          }
          evaluate_shared
          evaluate_shared
          set_check "$HEAD" completed success
          trap - EXIT

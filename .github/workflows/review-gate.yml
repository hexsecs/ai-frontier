name: Review gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Review event relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (rerun after thread resolution)
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            [[ "$REQUESTED" =~ ^[1-9][0-9]*$ ]]
            PRS=$(jq -cn --argjson pr "$REQUESTED" '[$pr]')
          else
            # Relay is only a wake-up signal. Never trust its PR association,
            # artifacts, head SHA or branch. Enumerate open PRs from our API.
            PRS=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" | jq -ce '[.[][] | .number] | unique')
          fi
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"
  review-gate:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    concurrency:
      group: review-policy-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Evaluate current review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          if [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$EVENT_HEAD" -f state=pending -f context=review-policy >/dev/null
          fi
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid,baseRefName,mergeStateStatus,state > /tmp/pr.json
          jq -e '.baseRefName == "main" and .state == "OPEN"' /tmp/pr.json >/dev/null
          HEAD=$(jq -r .headRefOid /tmp/pr.json)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context=review-policy >/dev/null
          trap 'gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=failure -f context=review-policy >/dev/null' EXIT
          evaluate() {
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid,baseRefName,mergeStateStatus,state > /tmp/pr.json
          jq -e --arg head "$HEAD" '.headRefOid == $head and .baseRefName == "main" and .state == "OPEN"' /tmp/pr.json >/dev/null
          gh api graphql --paginate --slurp -f query='query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviews(first:100,after:$endCursor){nodes{author{login} state body commit{oid}} pageInfo{hasNextPage endCursor}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" > /tmp/reviews.json
          gh api graphql --paginate --slurp -f query='query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100,after:$endCursor){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" > /tmp/threads.json
          MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          jq -n --slurpfile pr /tmp/pr.json --slurpfile r /tmp/reviews.json --slurpfile t /tmp/threads.json --arg main "$MAIN" '{pr:$pr[0],reviews:[$r[0][].data.repository.pullRequest.reviews.nodes[]],threads:[$t[0][].data.repository.pullRequest.reviewThreads.nodes[]],main_sha:$main}' > /tmp/gate.json
          test -f scripts/check_review_gate.py || { echo 'Trusted gate not installed'; exit 1; }
          python scripts/check_review_gate.py /tmp/gate.json
          }
          evaluate
          evaluate
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$HEAD"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context=review-policy >/dev/null
          trap - EXIT

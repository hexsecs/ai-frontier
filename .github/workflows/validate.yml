name: OpenShelf validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenShelf CLI
        run: python -m pip install git+https://github.com/OpenNorms/openshelf.git
      - name: Validate knowledge base
        run: openshelf lint .
